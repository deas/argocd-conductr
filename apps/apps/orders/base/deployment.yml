---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-deployment
  annotations:
    codefresh.io/app: simple-go-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trivial-go-web-app
  template:
    metadata:
      labels:
        app: trivial-go-web-app
    spec:
      containers:
        - name: webserver-simple
          imagePullPolicy: Always
          image: docker.io/kostiscodefresh/simple-env-app:1.0
          env:
            # Bumped by tools/kargo-promo-demo.sh to produce new Freight
            - name: APP_VERSION
              value: "3"
          ports:
            - containerPort: 8080

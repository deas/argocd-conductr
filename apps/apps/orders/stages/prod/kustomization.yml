apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Stages are folders: this overlay renders to rendered/apps/orders/prod on the
# machine-owned `rendered` branch (see assets/kargo/manifest-kargo.yaml)
namespace: orders-prod

resources:
  - ../../base

patches:
  - path: settings.yml
  - path: replicas.yml

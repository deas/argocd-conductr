# Minimal two-stage (test -> prod) promotion of the orders app using the
# Rendered Configs pattern: humans edit kustomize sources on wip, Kargo renders
# them per stage to rendered/apps/orders/<stage> on the long-lived stage/kargo
# branch, and Argo CD only ever deploys that flat YAML (see
# envs/*/appset-rendered-apps.yaml). Drive it with tools/kargo-promo-demo.sh.
# https://github.com/akuity/kargo/discussions/3203#discussioncomment-11718663
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-default
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-default
  namespace: kargo-default
spec:
  promotionPolicies:
    # New Freight flows into test unattended; prod stays a manual decision
    - stageSelector:
        name: test
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: orders
  namespace: kargo-default
spec:
  subscriptions:
    - git:
        repoURL: https://github.com/deas/argocd-conductr.git
        branch: wip
        commitSelectionStrategy: NewestFromBranch
        includePaths:
          - apps/apps/orders
---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promo-process
  namespace: kargo-default
spec:
  vars:
    - name: gitopsRepo
      value: https://github.com/deas/argocd-conductr.git
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitopsRepo }}
        checkout:
          # The Freight being promoted - not the branch head, so promoting an
          # older Freight to prod renders exactly that revision
          - commit: ${{ commitFrom(vars.gitopsRepo).ID }}
            path: ./src
          - branch: stage/kargo
            create: true
            path: ./out
    - uses: kustomize-build
      config:
        path: ./src/apps/apps/orders/envs/${{ ctx.stage }}
        outPath: ./out/rendered/apps/orders/${{ ctx.stage }}/manifest.yaml
    - uses: git-commit
      as: commit
      config:
        path: ./out
        message: "render orders ${{ ctx.stage }} @ ${{ commitFrom(vars.gitopsRepo).ID }}"
    - uses: git-push
      config:
        path: ./out
    - uses: argocd-update
      config:
        apps:
          - name: orders-${{ ctx.stage }}
            sources:
              - repoURL: ${{ vars.gitopsRepo }}
                desiredRevision: ${{ task.outputs.commit.commit }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: test
  namespace: kargo-default
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: orders
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - task:
            name: promo-process
          as: promo-process
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-default
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: orders
      sources:
        stages:
          - test
  promotionTemplate:
    spec:
      steps:
        - task:
            name: promo-process
          as: promo-process
